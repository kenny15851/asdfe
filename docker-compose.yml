version: '3.8'

services:
  reanime:
    build:
      context: .
      dockerfile: Dockerfile
    image: reanime-streaming:latest
    container_name: reanime_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
